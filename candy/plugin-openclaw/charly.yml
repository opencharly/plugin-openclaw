plugin-openclaw:
    candy:
        description: |-
            OUT-OF-TREE charly plugin serving the `openclaw` check verb — a standalone
            Go module (go.mod + main.go) that probes a running OpenClaw 2.0 gateway
            (the probe surface described below is verified against npm `openclaw@2026.9.8`),
            served OUT-OF-PROCESS over go-plugin gRPC via the charly plugin SDK
            (github.com/opencharly/sdk). charly's loader fetches this candy's repo,
            go-builds the provider binary on the HOST, and serves it via LocalTransport —
            so an authored `openclaw:` step dispatches through the provider registry
            exactly like a built-in.

            The verb PROBES the gateway two ways. HTTP probe methods (health/ready/startup)
            hit the /healthz /readyz /startupz endpoints — the container-probe surface
            OpenClaw 2.0 added for orchestrators — from the charly host against the
            resolved gateway endpoint (cc.ResolveEndpoint + cc.HTTPDo, so one authored
            step works unchanged against a pod's published port and a VM's forwarded one).
            CLI methods (status/models/channels/version) run the `openclaw` binary INSIDE
            the venue over the reverse channel (cc.Exec), where the gateway CLI connects
            to the loopback gateway over WebSocket. All methods are read-only; there are
            no mutating methods in this first cut.

            It is NOT a re-skin of the generic `http:` verb. `http:` already covers URL +
            status + body/header matchers, and this plugin exists for the two things it
            structurally cannot do: ENDPOINT RESOLUTION (cc.ResolveEndpoint means one
            authored step works unchanged against a pod's published port and a VM's
            forwarded one) and DOMAIN SEMANTICS (methods map to the gateway's real probe
            surface and return real verdicts, with `json_path:` to assert one field
            instead of pattern-matching a JSON blob; the CLI methods run in-venue where
            the gateway CLI lives, which `http:` cannot reach at all).

            The R10 consumer is an openclaw-bearing bed (pod) whose check composes this
            plugin alongside the `openclaw` candy from opencharly/layer-openclaw.
        plugin:
            source: github.com/opencharly/plugin-openclaw/candy/plugin-openclaw
            providers:
                - verb:openclaw
            primary:
                openclaw: method
        plan:
            - check: the openclaw verb dispatches through the provider registry and the gateway's /healthz liveness endpoint reports ok on a live deployment
              id: openclaw-verb-dispatches
              openclaw: health
              stdout:
                - contains: "ok"
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime

openclaw-skill:
    skill:
        name: openclaw-cmd
        family: check
        owner: plugin-openclaw
        triggers:
            - "the `openclaw:` check verb / probing an OpenClaw gateway from a candy or box plan"
